<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Organizational Design Tool</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/living.css" />
</head>
<body class="login-page">

  <main class="login-card">
    <img src="logo.png" alt="Azerconnect Group" class="login-logo" />

    <h1>Organizational Design Tool</h1>
    <p class="subtitle">Sign in with the credentials assigned by your Administrator</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email-input">Email</label>
        <input
          type="email"
          id="email-input"
          name="email"
          placeholder="you@company.com"
          autocomplete="email"
          required
        />
        <p id="email-error" class="field-error-text hidden" role="alert"></p>
      </div>

      <div class="form-group">
        <label for="password-input">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password-input"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            id="password-toggle"
            aria-label="Show password"
            aria-pressed="false"
          >
            <!-- eye (shown when password is hidden) -->
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <!-- eye-off (shown when password is visible) -->
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.9 19.9 0 0 1-4.17 5.19M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <p id="password-error" class="field-error-text hidden" role="alert"></p>
      </div>

      <button type="submit" class="btn-primary" id="login-button">
        <span id="login-button-label">Sign In</span>

        <!-- Loading spinner (hidden until submit) -->
        <span id="loading-spinner" class="spinner hidden" aria-hidden="true"></span>

        <!-- Success checkmark (hidden until successful login) -->
        <svg
          id="success-check"
          class="success-check hidden"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 13l4 4L19 7"
            stroke="#ffffff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </form>

    <!-- Error component (hidden by default) -->
    <div id="error-message" class="error-message hidden" role="alert"></div>

    <p class="footer-note">Accounts and passwords are managed by your Administrator. Contact them if you need access.</p>
  </main>

  <!-- Scripts: order matters — Supabase CDN + config first, then the
       app's own dependencies, then bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/google.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Bootstrap the login page once the DOM is ready.
    document.addEventListener("DOMContentLoaded", initLoginPage);
  </script>
  <script src="js/living-effects.js"></script>
</body>
</html>
